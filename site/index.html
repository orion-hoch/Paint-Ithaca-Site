<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Paint Ithaca — City model</title>
  <meta name="description" content="Explore or download the 3D model of Ithaca, rebuilt each night from short walking videos.">
  <link rel="canonical" href="https://paint-ithaca.com/">
  <meta name="model-base" content="https://model.paint-ithaca.com/city-model/">
  <meta name="theme-color" content="#14171C">
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="/city.css?v=1c9c264b">
  <script type="module" src="/city.js?v=7a8ae188"></script>
</head>
<body>
  <main class="viewer" aria-label="Ithaca 3D model">
    <div id="viewport" tabindex="0" aria-label="3D model. Drag to orbit, scroll to zoom, right-drag to pan. Arrow keys orbit, plus and minus zoom."></div>
    <div class="shade" aria-hidden="true"></div>
    <header class="app-header">
      <h1><img class="logo" src="/logo.png" alt="Paint Ithaca"><span>paint ithaca.</span></h1>
      <nav aria-label="Model controls">
        <button id="anchor" class="icon-button" aria-label="Choose a point to orbit around" title="Orbit a point" aria-pressed="false" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="7"/><circle class="filled" cx="12" cy="12" r="1.6"/><path d="M12 2.5V6M12 18v3.5M2.5 12H6M18 12h3.5"/></svg>
        </button>
        <button id="trees" class="icon-button" aria-label="Hide trees" title="Hide trees" aria-pressed="true" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 5.5 13h4L6 19h12l-3.5-6h4z"/><path d="M12 19v2"/><path class="slash" d="M4 20 20 4"/></svg>
        </button>
        <button id="locate" class="icon-button" aria-label="Show my location in the model" title="My location" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 4 4 11l7.5 1.5L13 20z"/></svg>
        </button>
        <a class="icon-button" href="/map.html" aria-label="Walk map and leaderboard" title="Walk map">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2zM9 4v14M15 6v14"/></svg>
        </a>
        <button id="info-open" class="icon-button" aria-label="About this model" title="About" aria-haspopup="dialog">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v6"/><circle class="filled" cx="12" cy="7" r=".8"/></svg>
        </button>
      </nav>
    </header>
    <div id="loading" class="loading" role="status"><span class="spinner" aria-hidden="true"></span><span class="sr-only">Loading city model</span></div>
    <p id="viewer-status" class="sr-only" role="status"></p>
    <p id="download-status" class="download-status" role="status"></p>
    <p id="viewer-error" role="alert" hidden></p>
    <noscript>Turn on JavaScript to see the 3D model, or <a href="https://model.paint-ithaca.com/city-model/preview.ply" download>download the PLY preview</a> instead.</noscript>
  </main>
  <dialog id="info" aria-labelledby="info-title">
    <div class="sheet-header">
      <h2 id="info-title">Ithaca in 3D</h2>
      <form method="dialog"><button class="icon-button" aria-label="Close" title="Close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M6 18 18 6"/></svg></button></form>
    </div>
    <p>A shared 3D model of Ithaca, rebuilt from short walking videos people record with the Paint Ithaca app. Every walk adds streets the model does not have yet.</p>
    <p id="model-date" class="muted"></p>
    <p id="model-count" class="muted"></p>
    <div class="sheet-actions">
      <a id="download" role="button" tabindex="0" aria-disabled="true">Download city model</a>
      <a href="/map.html">Walk map</a>
      <a href="/privacy.html">Privacy</a>
    </div>
  </dialog>
</body>
</html>
